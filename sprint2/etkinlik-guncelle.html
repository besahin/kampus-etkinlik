<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kampüs Etkinlikleri - Etkinlik Güncelle</title>
<link rel="stylesheet" href="css/numaran.css">
</head>
<body>

<header>
<p>Kampüs Etkinlikleri</p>
<nav>
<a href="index.html">Ana Sayfa</a>
<a href="etkinlikler.html">Etkinlikler</a>
<a href="etkinlik-ekle.html">Ekle</a>
<a href="etkinlik-guncelle.html">Güncelle</a>
</nav>
</header>

<main>
<h1>Etkinlik Güncelle</h1>

<form action="#" method="post">

<p>
<label for="ad">Etkinlik Adı</label>
<input type="text" id="ad" name="ad" value="Kariyer Günleri 2026" required>
</p>

<p>
<label for="kategori">Kategori</label>
<select id="kategori" name="kategori">
<option value="seminer" selected>Seminer</option>
<option value="atolye">Atölye</option>
<option value="konferans">Konferans</option>
<option value="sosyal">Sosyal Etkinlik</option>
</select>
</p>

<p>
<label for="tarih">Tarih</label>
<input type="date" id="tarih" name="tarih" value="2026-10-12" required>
</p>

<p>
<label for="saat">Saat</label>
<input type="time" id="saat" name="saat" value="14:00" required>
</p>

<p>
<label for="yer">Yer</label>
<input type="text" id="yer" name="yer" value="A Blok Konferans Salonu" required>
</p>

<p>
<label for="aciklama">Açıklama</label>
<textarea id="aciklama" name="aciklama" rows="5">Kariyer Günleri 2026 etkinliğinde sektörden konuşmacılar öğrencilerle bir araya gelecek, staj ve iş imkanları hakkında bilgi verecektir.</textarea>
</p>

<p>
<button type="submit">Güncelle</button>
</p>

</form>
</main>

<footer>
<p>Berat Efe Şahin &middot; 2416501054 &middot; 2026</p>
</footer>

</body>
</html>

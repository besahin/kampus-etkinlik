<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kampüs Etkinlikleri - Etkinlik Güncelle</title>
<link rel="stylesheet" href="css/2416501054.css">
</head>
<body>

<header>
<p>Kampüs Etkinlikleri</p>
<nav>
<a href="index.html">Ana Sayfa</a>
<a href="etkinlikler.html">Etkinlikler</a>
<a href="etkinlik-ekle.html">Ekle</a>
</nav>
</header>

<main>
<h1>Etkinlik Güncelle</h1>

<div id="mesaj" aria-live="polite"></div>

<form id="etkinlik-formu" action="#" method="post" data-mode="guncelle" novalidate>

<p>
<label for="baslik">Etkinlik Adı</label>
<input type="text" id="baslik" name="baslik" required>
</p>

<p>
<label for="kategori">Kategori</label>
<select id="kategori" name="kategori" required>
<option value="">Seçiniz</option>
</select>
</p>

<p>
<label for="tarih">Tarih</label>
<input type="date" id="tarih" name="tarih" required>
</p>

<p>
<label for="saat">Saat</label>
<input type="time" id="saat" name="saat" required>
</p>

<p>
<label for="yer">Yer</label>
<input type="text" id="yer" name="yer" required>
</p>

<p>
<label for="kontenjan">Kontenjan (isteğe bağlı)</label>
<input type="number" id="kontenjan" name="kontenjan" min="1" max="1000">
</p>

<p>
<label for="aciklama">Açıklama</label>
<textarea id="aciklama" name="aciklama" rows="5"></textarea>
</p>

<p>
<button type="submit">Güncelle</button>
</p>

</form>
</main>

<footer>
<p>Berat Efe Şahin &middot; 2416501054 &middot; 2026</p>
</footer>

<script type="module" src="js/event-form.js"></script>
</body>
</html>
